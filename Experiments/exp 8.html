
<!DOCTYPE html>
<html>
<head>
<title>MedCare Hospital</title>
<style>
body{font-family:Arial;text-align:center;background:#f5eee6}
h1{background:#641e30;color:white;padding:20px}
.box{background:#fffaf2;padding:20px;margin:20px auto;
width:80%;max-width:400px;border-radius:10px}
input,select,button{padding:10px;margin:7px}
button{background:#641e30;color:white;border:0}
button:hover{background:#bd6878}
</style>
</head>
<body>

<h1>MedCare Hospital</h1>

<div class="box">
<h2>Patient Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="alert('Login Successful')">Login</button>
</div>

<div class="box">
<h2>Book Appointment</h2>
<input id="name" placeholder="Patient Name">
<select id="doctor">
<option>Dr. Kumar - Cardiologist</option>
<option>Dr. Priya - Dentist</option>
<option>Dr. Arun - Neurologist</option>
</select>
<input type="date" id="date">
<input type="time" id="time">
<button onclick="book()">Book Now</button>
<p id="result"></p>
</div>

<div class="box">
<h2>Admin Panel</h2>
<input id="newdoctor" placeholder="Doctor Name">
<button onclick="add()">Add Doctor</button>
<p id="admin"></p>
</div>

<script>
function book(){
result.innerHTML="Appointment Confirmed for "+name.value+
" with "+doctor.value+" on "+date.value+" at "+time.value;
}
function add(){
admin.innerHTML=newdoctor.value+" added successfully!";
}
</script>

</body>
</html>
